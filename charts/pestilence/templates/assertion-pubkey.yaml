{{- if .Values.assertion.create }}
{{- $name := include "pestilence.assertionConfigMapName" . }}
{{- $existing := lookup "v1" "ConfigMap" (include "pestilence.namespace" .) $name }}
{{- if not $existing }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "pestilence.namespace" . }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall. It must stay paired with the private key in town.
    helm.sh/resource-policy: keep
data:
  assertion-key.pub: {{ required "assertion.publicKey is required when assertion.create is true and the ConfigMap does not exist. Run town's cluster-setup-scripts/generate-keys.sh." .Values.assertion.publicKey | quote }}
{{- end }}
{{- end }}
