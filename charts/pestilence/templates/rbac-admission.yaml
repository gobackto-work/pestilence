{{- if and .Values.rbac.create .Values.admissionPolicies.enabled }}
{{- $actor := printf "system:serviceaccount:%s:%s" (include "pestilence.namespace" .) (include "pestilence.serviceAccountName" .) }}
# The admission policies that make the scoped RBAC safe. Remove any of these and the
# scoping in rbac.yaml is void.
#
# `bind` is the only reason pestilence can create a RoleBinding that grants
# permissions it would otherwise hold cluster-wide. But `bind` cannot be scoped to
# RoleBindings rather than ClusterRoleBindings, and it does not constrain the
# namespace or the subject. These policies close those.
#
# FAILURE MODE TO REMEMBER: a policy that fails to MATCH looks identical to a policy
# that PASSES. Test each by mutation -- narrow it and confirm the request is denied.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pestilence-no-clusterrolebindings
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterrolebindings"]
  matchConditions:
    - name: actor-is-pestilence
      expression: >-
        request.userInfo.username == '{{ $actor }}'
  validations:
    - expression: "false"
      message: >-
        the pestilence control plane must not create or modify ClusterRoleBindings
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pestilence-no-clusterrolebindings
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  policyName: pestilence-no-clusterrolebindings
  validationActions: ["Deny", "Audit"]
  matchResources: {}
---
# The two legitimate RoleBinding shapes:
#   * the per-workspace self-binding: ClusterRole pestilence-tenant -> pestilence SA
#   * the broker's binding: Role broker -> <slug>-broker SA in the broker namespace
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pestilence-rolebinding-shapes
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: actor-is-pestilence
      expression: >-
        request.userInfo.username == '{{ $actor }}'
  validations:
    - expression: >-
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'pestilence-tenant') ||
        (object.roleRef.kind == 'Role' && object.roleRef.name == 'broker')
      message: >-
        pestilence may only bind the pre-created pestilence-tenant ClusterRole, or
        the broker Role it creates in the same namespace
    - expression: >-
        object.subjects.all(s,
          s.kind == 'ServiceAccount' &&
          (
            (object.roleRef.kind == 'ClusterRole' &&
             s.name == '{{ include "pestilence.serviceAccountName" . }}' &&
             s.namespace == '{{ include "pestilence.namespace" . }}') ||
            (object.roleRef.kind == 'Role' &&
             s.namespace == '{{ include "pestilence.scarabNamespace" . }}' &&
             s.name.endsWith('-broker'))
          ))
      message: >-
        pestilence may only bind the ClusterRole to its own ServiceAccount, and the
        broker Role to a broker ServiceAccount in the broker namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pestilence-rolebinding-shapes
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  policyName: pestilence-rolebinding-shapes
  validationActions: ["Deny", "Audit"]
  matchResources: {}
---
# Enforced by WHERE the binding applies, not by CEL: this evaluates only in
# namespaces WITHOUT the workspace label, and denies everything it sees.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pestilence-rolebinding-only-workspace-namespaces
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: actor-is-pestilence
      expression: >-
        request.userInfo.username == '{{ $actor }}'
  validations:
    - expression: "false"
      message: >-
        pestilence may only create RoleBindings in namespaces labelled
        agents.gobackto.work/workspace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pestilence-rolebinding-only-workspace-namespaces
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  policyName: pestilence-rolebinding-only-workspace-namespaces
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: agents.gobackto.work/workspace
          operator: DoesNotExist
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pestilence-namespace-invariants
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: actor-is-pestilence
      expression: >-
        request.userInfo.username == '{{ $actor }}'
  validations:
    # Checked on UPDATE too, so the labels cannot be removed after creation.
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted' &&
        object.metadata.labels['pod-security.kubernetes.io/audit'] == 'restricted' &&
        object.metadata.labels['pod-security.kubernetes.io/warn'] == 'restricted'
      message: >-
        a namespace created by pestilence must carry the restricted Pod Security
        Admission labels; without them a privileged pod could run in it
    - expression: >-
        has(object.metadata.labels) &&
        'agents.gobackto.work/workspace' in object.metadata.labels &&
        object.metadata.labels['agents.gobackto.work/workspace'] != ''
      message: >-
        a namespace created by pestilence must carry a non-empty workspace label
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pestilence-namespace-invariants
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  policyName: pestilence-namespace-invariants
  validationActions: ["Deny", "Audit"]
  matchResources: {}
{{- end }}
