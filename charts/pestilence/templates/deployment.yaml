apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pestilence.name" . }}
  namespace: {{ include "pestilence.namespace" . }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, and one replica: the store is SQLite on a ReadWriteOnce volume, so a
  # second pod cannot mount it -- and two reconcilers would both be applying the
  # same workspaces, which the drift sweep makes actively harmful rather than
  # merely wasteful.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pestilence.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pestilence.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pestilence.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "pestilence.name" . }}
          image: {{ include "pestilence.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr=:8080
            - -db=/var/lib/pestilence/pestilence.db
            # There is deliberately no -owner. The owner of a workspace comes from
            # the verified assertion and from nothing else.
            - -hostname-suffix={{ .Values.config.hostnameSuffix }}
            - -interval={{ .Values.config.interval }}
            - -drift-interval={{ .Values.config.driftInterval }}
            - -assertion-pubkey={{ .Values.config.assertionPubkeyPath }}
            {{- if .Values.config.brokerTls }}
            - -broker-tls
            {{- end }}
            # -kubeconfig is deliberately ABSENT. Empty means in-cluster config, so
            # the pod authenticates with its ServiceAccount token and the mounted CA,
            # and no kubeconfig ever exists as a file to leak.
          env:
            - name: PESTILENCE_BROKER_IMAGE
              value: {{ .Values.workspaceImages.broker | quote }}
            - name: PESTILENCE_AGENT_IMAGE
              value: {{ .Values.workspaceImages.agent | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # pestilence serves its own health, so readiness is the same check.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pestilence
            - name: tmp
              mountPath: /tmp
            - name: assertion-pubkey
              mountPath: /var/run/pestilence
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pestilence-data
        - name: tmp
          emptyDir: {}
        # Public, so a ConfigMap rather than a Secret. Paired with the private key in
        # the town namespace.
        - name: assertion-pubkey
          configMap:
            name: {{ include "pestilence.assertionConfigMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
