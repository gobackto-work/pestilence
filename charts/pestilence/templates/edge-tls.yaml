{{- if .Values.edge.enabled }}
{{- $tns := include "pestilence.traefikNamespace" . }}
{{- if .Values.edge.issuers.create }}
---
# HTTP-01 only. This CANNOT issue wildcards -- it is a protocol restriction, not a
# configuration mistake. Sufficient for the apex, not for workspace hostnames.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.edge.issuers.http01Name }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.edge.issuers.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Values.edge.issuers.http01Name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# DNS-01, for the wildcard. The challenge record is delegated to a separate zone,
# which cert-manager updates through the DNS provider's API.
#
# `selector.dnsZones` names the ORIGINAL zone, NOT the delegated one. `cnameStrategy:
# Follow` is required, because cert-manager resolves the challenge CNAME itself to
# decide which zone to update.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.edge.issuers.dns01Name }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.edge.issuers.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Values.edge.issuers.dns01Name }}-account-key
    solvers:
      - selector:
          dnsZones:
            {{- toYaml .Values.edge.issuers.dnsZones | nindent 12 }}
        dns01:
          cnameStrategy: Follow
          digitalocean:
            tokenSecretRef:
              name: {{ .Values.edge.issuers.dnsProviderSecret }}
              key: access-token
{{- end }}
{{- if .Values.edge.certificate.create }}
---
# The wildcard certificate for workspace hostnames.
#
# It lives in the traefik namespace on purpose. An Ingress can only reference a TLS
# secret in its own namespace, so the obvious approach -- give each workspace Ingress
# `tls.secretName` -- would replicate this secret into every tenant namespace. That
# would put the WILDCARD PRIVATE KEY inside an untrusted namespace, and a leaked
# wildcard key lets its holder impersonate every workspace on the domain.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.edge.certificate.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.edge.certificate.issuerRef }}
  dnsNames:
    {{- toYaml .Values.edge.certificate.dnsNames | nindent 4 }}
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 2160h # 90d
  renewBefore: 360h # 15d
{{- end }}
{{- if .Values.edge.tlsStore.create }}
---
# Serve the wildcard certificate for any host with no more specific certificate.
# This is what lets a workspace Ingress be nothing more than a host rule.
#
# Apply this ONLY after the Certificate is Ready. Pointing it at a secret that does
# not exist makes Traefik log errors and fall back to its self-signed default.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  defaultCertificate:
    secretName: {{ .Values.edge.tlsStore.secretName }}
{{- end }}
{{- end }}
