{{- if .Values.edge.enabled }}
{{- $tns := include "pestilence.traefikNamespace" . }}
# Traefik middlewares shared by the platform's Ingresses. They live in the traefik
# namespace because a Middleware is namespaced, and an Ingress elsewhere references
# it as `<namespace>-<name>@kubernetescrd`. pestilence attaches them to every
# workspace Ingress, in the order strip-untrusted-user, security-headers, forwardauth.
#
# Traefik references middlewares BY NAME, and a name that does not resolve is served
# WITHOUT the middleware rather than refused -- Traefik logs an error and carries on
# -- so a rename on either side produces a fully open workspace endpoint with no
# functional symptom. That is the first thing to check if a workspace is ever
# unexpectedly reachable.
#
# NOTE for anyone editing this file: it must NOT begin with a bare `---`. Comments
# before a document separator make the first document EMPTY, and kubectl then refuses
# the whole file.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  # redirectScheme rather than a hardcoded URL: with no port set it derives the port
  # from the scheme, so it emits `https://host/` and not `https://host:8443/`.
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  forwardAuth:
    # THE PORT IS NOT OPTIONAL. town's Service exposes 8080 and nothing else, so an
    # address without a port is a request to port 80, where nothing is listening.
    address: {{ .Values.edge.townAuthzAddress | quote }}
    # Trust the X-Forwarded-* headers Traefik itself adds, so town can see the
    # original host and URI rather than its own.
    trustForwardHeader: true
    # Copied from town's response onto the upstream request. X-Scarab-Assertion is
    # the signed one, and its `aud` is the workspace HOSTNAME, so it cannot be
    # replayed at a different workspace.
    authResponseHeaders:
      - X-Auth-User
      - X-Scarab-Assertion
---
# Removes any client-supplied X-Auth-User before ForwardAuth sets it. Traefik
# overwrites the header when town returns it, so this only matters when town answers
# 2xx WITHOUT the header -- a case that should not happen but would otherwise let the
# browser's own value through to the agent. Setting a header to the empty string is
# how Traefik deletes it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-untrusted-user
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      X-Auth-User: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ $tns }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    # forceSTSHeader matters behind a proxy that terminates TLS upstream: without it
    # Traefik omits the header when it does not believe the request was HTTPS, which
    # is exactly when the header is needed.
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
{{- end }}
