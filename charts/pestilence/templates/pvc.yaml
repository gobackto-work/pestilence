apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pestilence-data
  namespace: {{ include "pestilence.namespace" . }}
  labels:
    {{- include "pestilence.labels" . | nindent 4 }}
spec:
  # Named explicitly. openebs-hostpath is not the cluster's default StorageClass, so
  # a PVC that omits this sits Pending forever with no useful event.
  storageClassName: {{ .Values.persistence.storageClassName }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
