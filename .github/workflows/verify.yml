name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: pestilence
          POSTGRES_DB: pestilence_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pestilence -d pestilence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PESTILENCE_TEST_POSTGRES_URL: postgres://pestilence@127.0.0.1:5432/pestilence_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the git history as well as the tree, so a shallow clone
          # would make that check pass for the wrong reason.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Install the pinned tools
        run: |
          bash scripts/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The gate is the same script a developer runs. Nothing here duplicates it.
      # This runner has gcc, so the `-race` check runs here and skips on Windows.
      - name: Verify
        run: bash scripts/verify.sh
