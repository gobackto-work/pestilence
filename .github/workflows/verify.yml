name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the git history as well as the tree, so a shallow clone
          # would make that check pass for the wrong reason.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Install the pinned tools
        run: |
          bash scripts/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The gate is the same script a developer runs. Nothing here duplicates it.
      # This runner has gcc, so the `-race` check runs here and skips on Windows.
      - name: Verify
        run: bash scripts/verify.sh
